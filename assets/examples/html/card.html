<!doctype html>
<!-- Пример (образец): карточка на скринкасте — правый верх (x 1240–1860, не ниже y 680: ниже кружок), строки
     появляются по словам речи, последняя — белая плашка (второй уровень). Текст — нейтральная заглушка. -->
<html lang="ru"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../../scripts/graphics/html/base.css">
<link rel="stylesheet" href="../../../scripts/graphics/html/gfx.css">
<script src="../../../scripts/graphics/html/anim.js"></script>
<script src="../../../scripts/graphics/html/icons.js"></script>
</head>
<body>
  <div class="pos-top-right card vcol">
    <span class="plate k" data-in="0.0" data-out="9.3" data-fx="slide-left">запрос</span>
    <span class="plate" data-in="0.1" data-out="9.3" data-fx="slide-left">тема запроса</span>
    <span class="plate" data-in="1.6" data-out="9.3" data-fx="slide-left"><span class="or">10</span> примеров</span>
    <div class="it" data-in="4.0" data-out="9.3" data-fx="slide-left"><div class="tile sm"><i data-icon="search"></i></div><span class="plate s">поиск по теме</span></div>
    <span class="plate w" data-in="8.0" data-out="9.3" data-fx="pop" data-ofx="slide-left">итоговый список</span>
  </div>
