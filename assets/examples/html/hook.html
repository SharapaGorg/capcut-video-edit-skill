<!doctype html>
<!-- Пример (образец, не для вставки как есть): хук — три цифры-удара + две строки + подпись, поверх скринкаста,
     левый верх. Текст — нейтральная заглушка; свой текст берётся из речи (transcript_timeline). -->
<html lang="ru"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../../scripts/graphics/html/base.css">
<link rel="stylesheet" href="../../../scripts/graphics/html/gfx.css">
<script src="../../../scripts/graphics/html/anim.js"></script>
<style>
  .nums { position: absolute; left: 96px; top: 80px; display: flex; gap: 10px; }
  .nums .num { font-size: 120px; padding: 20px 30px 26px; }
  .lines { position: absolute; left: 96px; top: 270px; }
  .lines .plate { font-size: 64px; padding: 20px 30px 24px; margin-bottom: 8px; }
  .tag { position: absolute; left: 96px; top: 470px; }
</style></head>
<body>
  <div class="nums">
    <span class="num" data-in="0.0" data-out="5.8" data-fx="pop" data-ofx="slide-left" data-dist="40">×10</span>
    <span class="num" data-in="0.8" data-out="5.8" data-fx="pop" data-ofx="slide-left" data-dist="40">×5</span>
    <span class="num" data-in="1.3" data-out="5.8" data-fx="pop" data-ofx="slide-left" data-dist="40">×3</span>
  </div>
  <div class="lines stack">
    <span class="plate" data-in="2.2" data-out="5.8" data-fx="slide-left">В <span class="or">10 раз</span></span>
    <span class="plate" data-in="2.6" data-out="5.8" data-fx="slide-left">больше результата</span>
  </div>
  <div class="tag">
    <span class="plate s" data-in="4.0" data-out="5.8" data-fx="slide-left">чем обычно</span>
  </div>
</body></html>
